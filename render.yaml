services:
  - type: web
    name: dating-agent-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DATABASE_URL
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: APIFY_LINKEDIN_ACTOR_ID
        value: LpVuK3Zozwuipa5bp
      - key: APIFY_INSTAGRAM_ACTOR_ID
        value: dSCLg0C3YEZ83HzYX
